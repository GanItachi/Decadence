<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Décadence — Registre des Personnages</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@400;500;600&display=swap');

  :root{
    --void:#0d0a0f; --ash:#17131a; --panel:#1f1a24; --panel2:#241e2b;
    --line:#3a2f3d; --bone:#e7ded2; --dim:#9c8fa0;
    --ember:#b8452f; --ember-bright:#e0693f; --glow:#f3d9c4;
    --violet:#6b5b8a; --violet-bright:#9c85c9;
    --danger:#c23b3b; --ok:#5a9c6e;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(184,69,47,0.15), transparent 60%),
      var(--void);
    color:var(--bone); font-family:'Jost',sans-serif;
  }
  .wrap{ max-width:1100px; margin:0 auto; padding:36px 24px 100px; }

  header{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:16px; margin-bottom:30px; padding-bottom:20px; border-bottom:1px solid var(--line);
  }
  .titleblock .eyebrow{ letter-spacing:0.4em; text-transform:uppercase; font-size:10px; color:var(--ember-bright); margin-bottom:8px; }
  h1{ font-family:'Cinzel',serif; font-weight:800; font-size:28px; letter-spacing:0.03em; margin:0; color:var(--glow); }
  .badge-mode{
    font-family:'Jost'; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    padding:5px 12px; border:1px solid var(--line); color:var(--dim);
  }
  .badge-mode.admin{ color:var(--ember-bright); border-color:var(--ember); }

  .controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input[type=text], input[type=password], input[type=number], textarea, select{
    background:var(--panel); border:1px solid var(--line); color:var(--bone);
    padding:9px 12px; font-family:'Jost'; font-size:14px; outline:none; border-radius:2px;
  }
  input:focus, textarea:focus, select:focus{ border-color:var(--ember); }
  textarea{ width:100%; resize:vertical; min-height:60px; }

  button{
    font-family:'Jost'; font-size:13px; letter-spacing:0.03em; cursor:pointer;
    padding:9px 16px; border:1px solid var(--line); background:var(--panel);
    color:var(--bone); border-radius:2px; transition:all .15s;
  }
  button:hover{ border-color:var(--ember); color:var(--glow); }
  button.primary{ background:var(--ember); border-color:var(--ember); color:#fff; }
  button.primary:hover{ background:var(--ember-bright); }
  button.danger{ border-color:var(--danger); color:var(--danger); }
  button.danger:hover{ background:var(--danger); color:#fff; }
  button.ghost{ background:transparent; }
  button:disabled{ opacity:.4; cursor:not-allowed; }

  .status{ text-align:center; color:var(--dim); font-family:'Cormorant Garamond'; font-style:italic; padding:40px 0; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:18px; margin-top:24px; }
  .card{
    background:var(--panel); border:1px solid var(--line); cursor:pointer;
    overflow:hidden; transition:transform .15s, border-color .15s;
    display:flex; flex-direction:column;
  }
  .card:hover{ transform:translateY(-3px); border-color:var(--ember); }
  .card-img{
    width:100%; aspect-ratio:3/4; background:var(--ash);
    display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:12px;
    position:relative; overflow:hidden;
  }
  .card-img img{ width:100%; height:100%; object-fit:cover; display:block; }
  .img-fallback{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:10px; color:var(--dim); font-size:11px; background:var(--ash);
  }
  .card-body{ padding:12px 14px; }
  .card-name{ font-family:'Cinzel',serif; font-size:15px; color:var(--glow); margin:0 0 6px; }
  .card-meta{ font-size:12px; color:var(--dim); display:flex; justify-content:space-between; }
  .foyer-pill{
    display:inline-block; font-size:10px; padding:2px 8px; border-radius:20px;
    text-transform:uppercase; letter-spacing:0.05em; font-weight:600;
  }

  /* Foyer color coding */
  .f-latent{ background:#2a2a2a; color:#999; }
  .f-noir{ background:#1a1a1a; color:#ccc; border:1px solid #444; }
  .f-sombre{ background:#3d2b1f; color:#c98a4b; }
  .f-brulant{ background:#4a2210; color:#e07a3f; }
  .f-ardent{ background:#5c2a0d; color:#f39a4a; }
  .f-solaire{ background:#5c4a0d; color:#f3d24a; }
  .f-argent{ background:#3a3d42; color:#c9d3da; }
  .f-gris{ background:#4a4d52; color:#e3e7ea; }
  .f-blanc{ background:#e7ded2; color:#17131a; }
  .f-origine{ background:linear-gradient(90deg,#9c85c9,#e0693f); color:#fff; }

  .overlay{
    position:fixed; inset:0; background:rgba(5,3,6,0.85); backdrop-filter:blur(3px);
    display:flex; align-items:flex-start; justify-content:center; z-index:100;
    padding:40px 16px; overflow-y:auto;
  }
  .panel{
    background:var(--panel2); border:1px solid var(--line); max-width:720px; width:100%;
    padding:32px; position:relative;
  }
  .panel-close{
    position:absolute; top:16px; right:16px; background:none; border:none; color:var(--dim);
    font-size:22px; cursor:pointer; padding:4px 10px;
  }
  .panel-close:hover{ color:var(--ember-bright); }

  .detail-head{ display:flex; gap:24px; margin-bottom:24px; }
  .detail-img{
    width:150px; height:200px; flex-shrink:0; background:var(--ash);
    border:1px solid var(--line); position:relative; overflow:hidden;
  }
  .detail-img img{ width:100%; height:100%; object-fit:cover; display:block; }
  .detail-title h2{ font-family:'Cinzel',serif; color:var(--glow); font-size:26px; margin:0 0 6px; }
  .detail-title .faction{ color:var(--violet-bright); font-family:'Cormorant Garamond'; font-style:italic; font-size:16px; }
  .detail-title .joueur{ color:var(--dim); font-size:13px; margin-top:8px; }

  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:20px 0; }
  .stat-box{ background:var(--panel); border:1px solid var(--line); padding:10px; text-align:center; }
  .stat-box .label{ font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ember-bright); }
  .stat-box .val{ font-family:'Cinzel',serif; font-size:20px; color:var(--glow); margin-top:4px; }

  h3.section-title{
    font-family:'Cinzel',serif; font-size:15px; letter-spacing:0.04em; color:var(--violet-bright);
    margin:26px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  .tech-item, .hist-item{ background:var(--panel); border-left:2px solid var(--ember); padding:10px 14px; margin-bottom:8px; }
  .tech-item .tname{ font-weight:600; color:var(--glow); font-size:14px; }
  .tech-item .tdesc, .hist-item .hdesc{ font-size:13px; color:var(--dim); margin-top:3px; }
  .hist-item{ border-left-color:var(--violet-bright); }
  .hist-item .hdate{ font-size:11px; color:var(--violet-bright); text-transform:uppercase; letter-spacing:0.05em; }
  .empty-hint{ color:var(--dim); font-style:italic; font-size:13px; }

  .detail-actions{ display:flex; gap:10px; margin-top:26px; padding-top:20px; border-top:1px solid var(--line); }

  /* form */
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:16px 0; }
  .form-grid .full{ grid-column:1/-1; }
  label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--dim); margin-bottom:5px; }
  input, select, textarea{ width:100%; }
  .repeatable{ margin-top:8px; }
  .repeat-row{ display:flex; gap:8px; margin-bottom:8px; align-items:flex-start; }
  .repeat-row input, .repeat-row textarea{ flex:1; }
  .repeat-row button{ flex-shrink:0; padding:9px 12px; }

  .auth-box{ text-align:center; padding:60px 20px; }
  .auth-box p{ color:var(--dim); font-family:'Cormorant Garamond'; font-style:italic; margin-bottom:16px; }

  ::placeholder{ color:#5c526a; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="titleblock">
      <div class="eyebrow">Khaos Era</div>
      <h1>Registre des Personnages</h1>
    </div>
    <div class="controls">
      <input type="text" id="searchBox" placeholder="Rechercher un personnage..." oninput="renderGrid()">
      <span class="badge-mode" id="modeBadge">Mode joueur</span>
      <button id="adminBtn" onclick="toggleAdmin()">Mode Admin</button>
      <button id="newCharBtn" class="primary" style="display:none" onclick="openForm()">+ Nouveau</button>
    </div>
  </header>

  <div id="statusMsg" class="status">Chargement du registre...</div>
  <div class="grid" id="grid" style="display:none;"></div>
</div>

<!-- Detail overlay -->
<div class="overlay" id="detailOverlay" style="display:none;" onclick="if(event.target===this) closeDetail()">
  <div class="panel" id="detailPanel"></div>
</div>

<!-- Form overlay -->
<div class="overlay" id="formOverlay" style="display:none;" onclick="if(event.target===this) closeForm()">
  <div class="panel" id="formPanel"></div>
</div>

<script>
const STORAGE_KEY = 'khaos-characters';
const ADMIN_CODE = 'DECADENCE2666'; // change ce code directement ici

/*
  ============================================================
  CONFIGURATION DU STOCKAGE (obligatoire avant utilisation)
  ============================================================
  Ce fichier étant destiné à être hébergé de façon autonome
  (GitHub Pages, site perso...), il utilise JSONBin.io comme
  base de données gratuite partagée entre tous les joueurs.

  Étapes (5 minutes, une seule fois) :
  1. Va sur https://jsonbin.io et crée un compte gratuit.
  2. Dans le tableau de bord, clique "Create Bin", colle
     simplement  []  comme contenu, puis sauvegarde.
  3. Copie l'identifiant du bin (visible dans l'URL ou le
     dashboard, ex: 65a1b2c3...) et colle-le ci-dessous
     dans JSONBIN_BIN_ID.
  4. Va dans "API Keys" (menu de ton compte), copie ta
     clé "X-Master-Key" et colle-la dans JSONBIN_API_KEY.
  5. Sauvegarde ce fichier et héberge-le où tu veux.
  ============================================================
*/
const JSONBIN_BIN_ID = 'COLLE_TON_BIN_ID_ICI';
const JSONBIN_API_KEY = 'COLLE_TA_X-MASTER-KEY_ICI';
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;
const CONFIG_MISSING = JSONBIN_BIN_ID.startsWith('COLLE_') || JSONBIN_API_KEY.startsWith('COLLE_');

let characters = [];
let isAdmin = false;
let editingId = null;

const FOYERS = ['Latent','Noir','Sombre','Brûlant','Ardent','Solaire','Argent','Gris','Blanc','Origine'];

function foyerClass(f){
  return 'f-' + (f||'Latent').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

async function loadCharacters(){
  const statusEl = document.getElementById('statusMsg');
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    characters = res ? JSON.parse(res.value) : [];
  }catch(e){
    characters = []; // clé pas encore créée
  }
  statusEl.style.display='none';
  document.getElementById('grid').style.display='grid';
  renderGrid();
}

async function saveCharacters(){
  try{
    const result = await window.storage.set(STORAGE_KEY, JSON.stringify(characters), true);
    if(!result) throw new Error('save failed');
  }catch(e){
    alert("Erreur de sauvegarde. Réessaie dans un instant.");
  }
}

function toggleAdmin(){
  if(isAdmin){
    isAdmin = false;
    updateModeUI();
    return;
  }
  const code = prompt("Code administrateur :");
  if(code === ADMIN_CODE){
    isAdmin = true;
    updateModeUI();
  } else if(code !== null){
    alert("Code incorrect.");
  }
}

function updateModeUI(){
  const badge = document.getElementById('modeBadge');
  const btn = document.getElementById('adminBtn');
  const newBtn = document.getElementById('newCharBtn');
  if(isAdmin){
    badge.textContent = 'Mode admin';
    badge.classList.add('admin');
    btn.textContent = 'Quitter le mode admin';
    newBtn.style.display = 'inline-block';
  }else{
    badge.textContent = 'Mode joueur';
    badge.classList.remove('admin');
    btn.textContent = 'Mode Admin';
    newBtn.style.display = 'none';
  }
  renderGrid();
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const q = document.getElementById('searchBox').value.toLowerCase();
  const filtered = characters.filter(c =>
    c.name.toLowerCase().includes(q) ||
    (c.faction||'').toLowerCase().includes(q) ||
    (c.joueur||'').toLowerCase().includes(q)
  );

  if(filtered.length===0){
    grid.innerHTML = `<div class="status" style="grid-column:1/-1">${characters.length===0 ? 'Aucun personnage enregistré pour le moment.' : 'Aucun résultat.'}</div>`;
    return;
  }

  grid.innerHTML = filtered.map(c => `
    <div class="card" onclick="openDetail('${c.id}')">
      <div class="card-img">
        ${c.imageUrl ? `<img src="${escapeAttr(c.imageUrl)}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="img-fallback" style="display:none">Lien image invalide ou expiré</div>` : `<div class="img-fallback">Pas d'image</div>`}
      </div>
      <div class="card-body">
        <p class="card-name">${escapeHtml(c.name)}</p>
        <div class="card-meta">
          <span class="foyer-pill ${foyerClass(c.foyer)}">${c.foyer||'Latent'}</span>
          <span>${escapeHtml(c.faction||'')}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str||'';
  return d.innerHTML;
}

function escapeAttr(str){
  return (str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function openDetail(id){
  const c = characters.find(x=>x.id===id);
  if(!c) return;
  const panel = document.getElementById('detailPanel');
  panel.innerHTML = `
    <button class="panel-close" onclick="closeDetail()">&times;</button>
    <div class="detail-head">
      <div class="detail-img">
        ${c.imageUrl ? `<img src="${escapeAttr(c.imageUrl)}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="img-fallback" style="display:none">Lien image invalide ou expiré</div>` : `<div class="img-fallback">Pas d'image</div>`}
      </div>
      <div class="detail-title">
        <h2>${escapeHtml(c.name)}</h2>
        <div class="faction">${escapeHtml(c.faction||'Sans faction')}</div>
        <span class="foyer-pill ${foyerClass(c.foyer)}" style="margin-top:8px;display:inline-block;">${c.foyer||'Latent'}</span>
        ${c.joueur ? `<div class="joueur">Joué par : ${escapeHtml(c.joueur)}</div>` : ''}
        ${c.configuration ? `<div class="joueur">Configuration : ${escapeHtml(c.configuration)}</div>` : ''}
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-box"><div class="label">Vie</div><div class="val">${c.vie||0}</div></div>
      <div class="stat-box"><div class="label">RA</div><div class="val">${c.ra||0}</div></div>
      <div class="stat-box"><div class="label">PUI</div><div class="val">${c.pui||0}</div></div>
      <div class="stat-box"><div class="label">VIT</div><div class="val">${c.vit||0}</div></div>
    </div>

    <h3 class="section-title">Techniques</h3>
    ${(c.techniques&&c.techniques.length) ? c.techniques.map(t=>`
      <div class="tech-item"><div class="tname">${escapeHtml(t.name)}</div><div class="tdesc">${escapeHtml(t.desc||'')}</div></div>
    `).join('') : '<p class="empty-hint">Aucune technique enregistrée.</p>'}

    <h3 class="section-title">Artefact</h3>
    ${c.artefact ? `<div class="tech-item"><div class="tname">${escapeHtml(c.artefact.name||'')}</div><div class="tdesc">${escapeHtml(c.artefact.desc||'')}</div></div>` : '<p class="empty-hint">Aucun artefact.</p>'}

    <h3 class="section-title">Historique</h3>
    ${(c.historique&&c.historique.length) ? c.historique.slice().reverse().map(h=>`
      <div class="hist-item"><div class="hdate">${escapeHtml(h.date||'')}</div><div class="hdesc">${escapeHtml(h.text||'')}</div></div>
    `).join('') : '<p class="empty-hint">Aucun événement enregistré.</p>'}

    ${isAdmin ? `
      <div class="detail-actions">
        <button class="primary" onclick="closeDetail(); openForm('${c.id}')">Modifier</button>
        <button class="danger" onclick="deleteChar('${c.id}')">Supprimer</button>
      </div>
    ` : ''}
  `;
  document.getElementById('detailOverlay').style.display='flex';
}

function closeDetail(){
  document.getElementById('detailOverlay').style.display='none';
}

async function deleteChar(id){
  if(!confirm("Supprimer définitivement ce personnage ?")) return;
  characters = characters.filter(c=>c.id!==id);
  await saveCharacters();
  closeDetail();
  renderGrid();
}

function openForm(id){
  if(!isAdmin) return;
  editingId = id || null;
  const c = id ? characters.find(x=>x.id===id) : {
    name:'', imageUrl:'', foyer:'Latent', faction:'', joueur:'', configuration:'',
    vie:100, ra:0, pui:10, vit:5, techniques:[], artefact:{name:'',desc:''}, historique:[]
  };

  const panel = document.getElementById('formPanel');
  panel.innerHTML = `
    <button class="panel-close" onclick="closeForm()">&times;</button>
    <h2 style="font-family:'Cinzel',serif;color:var(--glow);margin-top:0;">${id?'Modifier':'Nouveau'} personnage</h2>

    <div class="form-grid">
      <div class="full"><label>Nom</label><input id="f_name" value="${escapeHtml(c.name)}"></div>
      <div class="full"><label>URL de l'image</label><input id="f_img" value="${escapeHtml(c.imageUrl)}" placeholder="https://..."></div>
      <div>
        <label>Foyer</label>
        <select id="f_foyer">${FOYERS.map(f=>`<option ${c.foyer===f?'selected':''}>${f}</option>`).join('')}</select>
      </div>
      <div><label>Faction</label><input id="f_faction" value="${escapeHtml(c.faction)}"></div>
      <div><label>Joueur</label><input id="f_joueur" value="${escapeHtml(c.joueur)}"></div>
      <div><label>Configuration</label><input id="f_config" value="${escapeHtml(c.configuration)}" placeholder="ex : Équilibré"></div>
      <div><label>Vie</label><input type="number" id="f_vie" value="${c.vie||0}"></div>
      <div><label>RA</label><input type="number" id="f_ra" value="${c.ra||0}"></div>
      <div><label>PUI</label><input type="number" id="f_pui" value="${c.pui||0}"></div>
      <div><label>VIT</label><input type="number" id="f_vit" value="${c.vit||0}"></div>
    </div>

    <h3 class="section-title">Techniques</h3>
    <div class="repeatable" id="techList"></div>
    <button type="button" onclick="addTechRow()">+ Ajouter une technique</button>

    <h3 class="section-title">Artefact</h3>
    <div class="form-grid">
      <div><label>Nom</label><input id="f_art_name" value="${escapeHtml(c.artefact?.name||'')}"></div>
      <div><label>Description</label><input id="f_art_desc" value="${escapeHtml(c.artefact?.desc||'')}"></div>
    </div>

    <h3 class="section-title">Historique</h3>
    <div class="repeatable" id="histList"></div>
    <button type="button" onclick="addHistRow()">+ Ajouter un événement</button>

    <div class="detail-actions">
      <button class="primary" onclick="submitForm()">Enregistrer</button>
      <button class="ghost" onclick="closeForm()">Annuler</button>
    </div>
  `;

  const techList = document.getElementById('techList');
  (c.techniques||[]).forEach(t=>addTechRow(t.name,t.desc));
  const histList = document.getElementById('histList');
  (c.historique||[]).forEach(h=>addHistRow(h.date,h.text));

  document.getElementById('formOverlay').style.display='flex';
}

function addTechRow(name='',desc=''){
  const list = document.getElementById('techList');
  const row = document.createElement('div');
  row.className='repeat-row';
  row.innerHTML = `
    <input placeholder="Nom" class="t-name" value="${escapeHtml(name)}">
    <input placeholder="Description" class="t-desc" value="${escapeHtml(desc)}">
    <button type="button" onclick="this.parentElement.remove()">✕</button>
  `;
  list.appendChild(row);
}

function addHistRow(date='',text=''){
  const list = document.getElementById('histList');
  const row = document.createElement('div');
  row.className='repeat-row';
  row.innerHTML = `
    <input placeholder="Date / session" class="h-date" style="max-width:140px" value="${escapeHtml(date)}">
    <input placeholder="Événement" class="h-text" value="${escapeHtml(text)}">
    <button type="button" onclick="this.parentElement.remove()">✕</button>
  `;
  list.appendChild(row);
}

async function submitForm(){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ alert("Le nom est obligatoire."); return; }

  const techniques = Array.from(document.querySelectorAll('#techList .repeat-row')).map(r=>({
    name: r.querySelector('.t-name').value.trim(),
    desc: r.querySelector('.t-desc').value.trim()
  })).filter(t=>t.name);

  const historique = Array.from(document.querySelectorAll('#histList .repeat-row')).map(r=>({
    date: r.querySelector('.h-date').value.trim(),
    text: r.querySelector('.h-text').value.trim()
  })).filter(h=>h.text);

  const data = {
    id: editingId || ('char_' + Date.now()),
    name,
    imageUrl: document.getElementById('f_img').value.trim(),
    foyer: document.getElementById('f_foyer').value,
    faction: document.getElementById('f_faction').value.trim(),
    joueur: document.getElementById('f_joueur').value.trim(),
    configuration: document.getElementById('f_config').value.trim(),
    vie: parseInt(document.getElementById('f_vie').value)||0,
    ra: parseInt(document.getElementById('f_ra').value)||0,
    pui: parseInt(document.getElementById('f_pui').value)||0,
    vit: parseInt(document.getElementById('f_vit').value)||0,
    techniques,
    artefact: {
      name: document.getElementById('f_art_name').value.trim(),
      desc: document.getElementById('f_art_desc').value.trim()
    },
    historique
  };

  if(editingId){
    characters = characters.map(c=>c.id===editingId?data:c);
  }else{
    characters.push(data);
  }

  await saveCharacters();
  closeForm();
  renderGrid();
}

function closeForm(){
  document.getElementById('formOverlay').style.display='none';
  editingId = null;
}

loadCharacters();
</script>

</body>
</html>
